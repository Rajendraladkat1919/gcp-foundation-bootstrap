---
# Compute organization policies. Protocol forwarding and external IP rules are list policies.

compute.disableGuestAttributesAccess:
  rules:
    - enforce: true

compute.disableSerialPortAccess:
  rules:
    - enforce: true

compute.requireOsLogin:
  rules:
    - enforce: true

compute.requireShieldedVm:
  rules:
    - enforce: true

compute.restrictProtocolForwardingCreationForTypes:
  rules:
    - allow:
        values:
          - INTERNAL

compute.restrictXpnProjectLienRemoval:
  rules:
    - enforce: true

compute.skipDefaultNetworkCreation:
  rules:
    - enforce: true

compute.vmExternalIpAccess:
  rules:
    - deny:
        all: true

# Prevent nested virtualization (security hardening, reduces hypervisor attack surface).
compute.disableNestedVirtualization:
  rules:
    - enforce: true

# Force new projects to use zonal DNS only (avoids global DNS changes causing outages).
compute.setNewProjectDefaultToZonalDNSOnly:
  rules:
    - enforce: true
