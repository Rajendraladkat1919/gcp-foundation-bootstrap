---
# IAM organization policies.

iam.disableServiceAccountKeyCreation:
  rules:
    - enforce: true

# Prevent uploading externally-generated SA keys (only GCP-managed keys allowed).
iam.disableServiceAccountKeyUpload:
  rules:
    - enforce: true

# Prevent automatic Editor/Owner grants to the Compute and App Engine default SAs.
iam.automaticIamGrantsForDefaultServiceAccounts:
  rules:
    - enforce: true

# Prevent GKE Workload Identity pools from being created outside of OIDC federation
# so on-prem workloads must use the approved OIDC path (Okta → WIF).
iam.disableWorkloadIdentityClusterCreation:
  rules:
    - enforce: true

# Prevent any principal from exempting themselves from audit logging.
# Without this an admin can add a data-access audit exemption and hide API calls.
iam.disableAuditLoggingExemptions:
  rules:
    - enforce: true
