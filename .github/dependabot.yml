version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: terraform
    directories:
      - "/0-core-projects"
      - "/1-org"
      - "/2-network-projects"
      - "/3-cicd-identity"
      - "/4-workload-projects"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
