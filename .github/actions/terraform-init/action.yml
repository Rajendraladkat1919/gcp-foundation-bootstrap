name: terraform-init
description: Authenticate to Google Cloud through OIDC and run terraform init for one stage. Modules are sourced directly from the public Cloud Foundation Fabric GitHub repo — no private token needed.
inputs:
  stage:
    description: Stage directory, for example 1-org.
    required: true
  service-account:
    description: Service account to impersonate through workload identity federation.
    required: true
  workload-identity-provider:
    description: Full resource name of the workload identity provider.
    required: true
  state-bucket:
    description: GCS bucket that holds the Terraform state for this repository.
    required: true
  terraform-version:
    description: Terraform version, exact.
    required: true
runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}

    - name: terraform init
      shell: bash
      working-directory: ${{ inputs.stage }}
      env:
        STATE_BUCKET: ${{ inputs.state-bucket }}
      run: terraform init -input=false -backend-config="bucket=${STATE_BUCKET}"
