name: drift-detect

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions: {}

env:
  TF_VERSION: "1.16.6"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  stages:
    name: stages
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: set
        run: echo "matrix=$(scripts/changed-stages.sh)" >> "$GITHUB_OUTPUT"

  drift:
    name: drift (${{ matrix.stage }})
    needs: stages
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        stage: ${{ fromJSON(needs.stages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/terraform-init
        with:
          stage: ${{ matrix.stage }}
          service-account: ${{ vars.TF_PLAN_SA }}
          workload-identity-provider: ${{ vars.WIF_PROVIDER }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          modules-token: ${{ secrets.MODULES_READ_TOKEN }}
          terraform-version: ${{ env.TF_VERSION }}

      - name: terraform plan (drift check)
        id: plan
        working-directory: ${{ matrix.stage }}
        run: |
          set +e
          terraform plan -lock=false -detailed-exitcode -no-color 2>&1 | tee plan.log
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open or update a drift issue
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          STAGE: ${{ matrix.stage }}
        with:
          script: |
            const fs = require('fs');
            const stage = process.env.STAGE;
            const title = `Drift detected: ${stage}`;
            const plan = fs.readFileSync(`${stage}/plan.log`, 'utf8').slice(0, 60000);
            const body = [
              `Scheduled run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '```terraform',
              plan,
              '```',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'drift', per_page: 100,
            });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['drift'] });
            }

      - name: Fail the job on drift or error
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1
