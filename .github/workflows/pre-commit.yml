name: pre-commit

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: pre-commit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.6"

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Allow Terraform to clone the private modules repository
        env:
          MODULES_TOKEN: ${{ secrets.MODULES_READ_TOKEN }}
        run: |
          echo "::add-mask::${MODULES_TOKEN}"
          git config --global url."https://x-access-token:${MODULES_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install pre-commit tooling
        run: |
          python -m pip install --disable-pip-version-check pre-commit==4.4.0 checkov==3.3.30
          go install github.com/terraform-docs/terraform-docs@v0.24.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: tflint plugins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init --config=.tflint.hcl

      - name: Run every hook on every file
        env:
          # Committing to main is blocked by branch protection, not by a CI job.
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Enforce conventional commit style PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|ci|test|revert|security)(\([a-z0-9-]+\))?!?: .{3,}'
          if ! grep -Eq "$pattern" <<<"$PR_TITLE"; then
            echo "::error::PR title must look like 'feat(1-org): add folder' (got: $PR_TITLE)"
            exit 1
          fi

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
