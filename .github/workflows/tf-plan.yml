name: tf-plan

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: tf-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.6"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  CHECKOV_VERSION: "3.3.30"

jobs:
  stages:
    name: stages
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      any: ${{ steps.set.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: set
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          matrix="$(scripts/changed-stages.sh "$BASE_SHA")"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$matrix" = "[]" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

  plan:
    name: plan (${{ matrix.stage }})
    needs: stages
    # Fork PRs cannot get an OIDC token, and must never be planned with cloud credentials.
    if: needs.stages.outputs.any == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        stage: ${{ fromJSON(needs.stages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/terraform-init
        with:
          stage: ${{ matrix.stage }}
          service-account: ${{ vars.TF_PLAN_SA }}
          workload-identity-provider: ${{ vars.WIF_PROVIDER }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          modules-token: ${{ secrets.MODULES_READ_TOKEN }}
          terraform-version: ${{ env.TF_VERSION }}

      - name: terraform validate
        working-directory: ${{ matrix.stage }}
        run: terraform validate

      - name: terraform plan
        id: plan
        working-directory: ${{ matrix.stage }}
        run: |
          set +e
          # -lock=false: the plan identity has read-only access to state, and a
          # PR plan must never block or mutate state.
          terraform plan -lock=false -detailed-exitcode -no-color -out=tfplan 2>&1 | tee plan.log
          code="${PIPESTATUS[0]}"
          set -e
          echo "exitcode=${code}" >> "$GITHUB_OUTPUT"

      - name: Policy scan of the plan (checkov)
        id: checkov
        if: steps.plan.outputs.exitcode != '1'
        working-directory: ${{ matrix.stage }}
        run: |
          terraform show -json tfplan > tfplan.json
          set +e
          pipx run --spec "checkov==${CHECKOV_VERSION}" checkov -f tfplan.json \
            --framework terraform_plan --compact --quiet 2>&1 | tee checkov.log
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Build PR comment
        if: always()
        working-directory: ${{ matrix.stage }}
        env:
          STAGE: ${{ matrix.stage }}
          PLAN_CODE: ${{ steps.plan.outputs.exitcode }}
          CHECKOV_CODE: ${{ steps.checkov.outputs.exitcode }}
        run: |
          case "$PLAN_CODE" in
            0) verdict="no changes" ;;
            2) verdict="changes to apply on merge" ;;
            *) verdict="FAILED" ;;
          esac
          {
            echo "### Terraform plan: \`${STAGE}\` (${verdict})"
            echo "Policy scan: $([ "${CHECKOV_CODE:-skipped}" = "0" ] && echo passed || echo "${CHECKOV_CODE:-skipped}")"
            echo
            echo "<details><summary>Plan output</summary>"
            echo
            echo '```terraform'
            head -c 55000 plan.log
            echo '```'
            echo "</details>"
          } > comment.md

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: always()
        with:
          header: plan-${{ matrix.stage }}
          path: ${{ matrix.stage }}/comment.md

      - name: Fail the job when the plan or the policy scan failed
        if: always()
        env:
          PLAN_CODE: ${{ steps.plan.outputs.exitcode }}
          CHECKOV_CODE: ${{ steps.checkov.outputs.exitcode }}
        run: |
          if [ "${PLAN_CODE:-1}" = "1" ] || [ "${CHECKOV_CODE:-0}" != "0" ]; then
            echo "::error::plan or policy scan failed for ${{ matrix.stage }}"
            exit 1
          fi

  # Single required status check for branch protection, so it keeps working when
  # the matrix is empty or changes shape.
  plan-gate:
    name: plan-gate
    if: always()
    needs: [stages, plan]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every plan to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
