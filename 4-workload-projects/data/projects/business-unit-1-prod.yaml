# One file per workload project. Merge a new file to get a project, a grant of
# sa-tf-bootstrap creates the project; sa-tf-workload-* deploys into it, and a state bucket.
business_unit: business-unit-1
environment: prod            # prod | nonprod
short_name: bu-1             # project id = <prefix>-<env code>-<environment>-<short_name>
repository: gcp-wlp-prod-bu-1
cost_center: platform
# APIs on top of the baseline every project gets (foundation, logging, monitoring,
# bigquery, secret manager, storage, compute, cloudkms). The stage creates the
# Cloud KMS key that encrypts this project's state bucket.
# extra_apis: []
# deployer_roles: override the default workload SA roles (editor + projectIamAdmin + secretmanager.admin + serviceAccountAdmin).
# deployer_roles: []
# Human access. Principals must be groups, never individual users.
iam_groups:
  "group:business-unit-1@example.com":
    - roles/viewer
