# One file per workload project. Merge a new file to get a project, a grant of
# sa-tf-bootstrap creates the project; sa-tf-workload-* deploys into it, and a state bucket.
business_unit: business-unit-1
environment: nonprod         # prod | nonprod
short_name: bu-1             # project id = <prefix>-<env code>-<environment>-<short_name>
repository: gcp-wlp-nonprod-bu-1
cost_center: platform
# Human access. Principals must be groups, never individual users.
iam_groups:
  # Commercial BU team — view access to their nonprod project
  "group:business-unit-commercial@platform-engineering.site":
    - roles/viewer
  # Developers — can deploy and test in nonprod, view-only access here (deploy SA handles writes)
  "group:grp-developer@platform-engineering.site":
    - roles/viewer
  # Platform Engineers — broader visibility across all workload projects
  "group:arp-platform-engineers@platform-engineering.site":
    - roles/viewer
